name: DynamicIslandToastExample
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
packages:
  DynamicIslandToast:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DynamicIslandToastExample:
    type: application
    platform: iOS
    sources:
      - DynamicIslandToastExample
    dependencies:
      - package: DynamicIslandToast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamicislandtoast.example
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Toast Example
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: DynamicIslandToastExample/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  DynamicIslandToastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/DynamicIslandToastTests
      - path: ../Tests/DynamicIslandToastObjCTestSupport/DITThrowingCornerRadiusFixture.m
    dependencies:
      - package: DynamicIslandToast
      - target: DynamicIslandToastExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamicislandtoast.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DynamicIslandToastExample.app/DynamicIslandToastExample"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../Tests/DynamicIslandToastObjCTestSupport/include"
        OTHER_SWIFT_FLAGS:
          - "$(inherited)"
          - "-Xcc"
          - "-fmodule-map-file=$(SRCROOT)/TestSupport.modulemap"
schemes:
  DynamicIslandToastExample:
    build:
      targets:
        DynamicIslandToastExample: all
        DynamicIslandToastTests: [test, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DynamicIslandToastTests
